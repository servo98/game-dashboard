x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    network_mode: host  # access both Docker services (via exposed ports) and game containers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static-site:/var/www/aypapol:ro
      - ./chat-landing:/var/www/chat-landing:ro  # landing de chat.aypapol.com (raíz)
      - /srv/rubas/sites:/var/www/rubas:ro  # sitios estáticos de Rubas (rubas.aypapol.com)
      - /etc/letsencrypt:/etc/letsencrypt:ro  # certificados SSL
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging

  backend:
    build: ./backend
    env_file: .env
    environment:
      - DB_PATH=/data/game-panel.db
    ports:
      - "127.0.0.1:3000:3000"  # exposed to host for nginx (host network)
    volumes:
      - backend-data:/data
      - /var/run/docker.sock:/var/run/docker.sock  # dockerode needs this
      - ./games:/app/games:ro
      - /data:/host-data  # game volumes for backup/restore
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/servers').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - panel

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:3080:80"  # exposed to host for nginx (host network)
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - panel

  bot:
    build: ./bot
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    networks:
      - panel

  # ─── ChatPapol (chat.aypapol.com) ────────────────────────────────────────
  # Discord propio: backend Bun + LiveKit (SFU voz/video). Servicios always-on
  # como backend/dashboard/bot — NO un "game". Imagen pre-buildeada en GHCR.
  # Repo: github.com/servo98/chatAyPapol
  chatpapol:
    image: ghcr.io/servo98/chatpapol-server:latest
    # El backend (red bridge `panel`) alcanza a LiveKit (red host) vía el host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # URL pública del SFU que se entrega a LOS CLIENTES (nginx wss → 7880).
      - LIVEKIT_URL=wss://livekit.aypapol.com
      # API HTTP del SFU para el reconciliador de presencia server-side (RoomService).
      # bridge → host:7880 (livekit corre en host-networking). Si Docker es viejo y
      # host.docker.internal no resuelve, usar http://172.17.0.1:7880 vía .env.
      - LIVEKIT_API_URL=http://host.docker.internal:7880
      # Keys reales en .env (repo público → NO commitear secretos).
      - LIVEKIT_KEY=${LIVEKIT_KEY}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET}
      - GITHUB_REPO=servo98/chatAyPapol
    ports:
      - "127.0.0.1:3210:3210"  # nginx (host net) proxya chat.aypapol.com aquí
    volumes:
      - chatpapol-data:/app/data  # SQLite + uploads/stickers/releases
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    networks:
      - panel

  livekit:
    image: livekit/livekit-server:latest
    # host networking: WebRTC usa el rango UDP 50000-50100 sin mapear puerto a
    # puerto. Hay que abrir ese rango en ufw. nginx proxya la señalización
    # (wss livekit.aypapol.com → 127.0.0.1:7880); el media va directo por UDP.
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      # Keys vía env (formato "APIkey: secret") para no escribirlas en el yaml.
      # Comillas obligatorias: el ": " del valor haría que YAML lo lea como mapa.
      - "LIVEKIT_KEYS=${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

  # ─── Filebrowser (rubas.aypapol.com/admin/) ──────────────────────────────
  # Panel web para que Rubas suba carpetas de sitios estáticos (drag-and-drop,
  # login). Fork gtsteffaniak ("Quantum"): puerto interno 80, config en
  # /home/filebrowser/data/config.yaml, corre como uid 1000. Monta el MISMO
  # dir que nginx (/srv/rubas/sites) pero en :rw; nginx lo sirve en :ro.
  # nginx (red host) lo alcanza vía el puerto publicado 127.0.0.1:3290.
  # OJO: la CI NO arranca servicios nuevos → primer `up -d filebrowser` manual
  # (ver DEPLOY-RUBAS.md), igual que chatpapol/livekit.
  filebrowser:
    image: gtstef/filebrowser:stable
    environment:
      # Password del admin (usuario `rubas`) vía env — repo público, NO en config.
      - FILEBROWSER_ADMIN_PASSWORD=${RUBAS_FB_PASSWORD}
    ports:
      - "127.0.0.1:3290:80"  # nginx (host net) proxya rubas.aypapol.com/admin/ aquí
    volumes:
      - ./rubas/filebrowser.yaml:/home/filebrowser/data/config.yaml:ro  # config (sin secretos)
      - filebrowser-data:/home/filebrowser/data  # database.db + cache (estado)
      - /srv/rubas/sites:/srv:rw  # árbol de sitios: publico/ y oculto/
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    networks:
      - panel

volumes:
  backend-data:
  chatpapol-data:
  filebrowser-data:

networks:
  panel:
    driver: bridge
