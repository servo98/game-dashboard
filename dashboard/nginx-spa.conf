server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash de contenido en el nombre (index-BHGot-MA.css), así
    # que un fichero dado nunca cambia: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html es lo contrario: es la única pieza sin hash, y es la que dice
    # qué assets hay que pedir. Si el navegador lo da por fresco sin revalidar,
    # sigue pidiendo los assets del build anterior y el deploy no llega nunca.
    # Sin cabecera, el navegador aplica caché heurística y pasa justo eso.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
