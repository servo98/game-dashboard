events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 5m;

    # No anunciar la versión de nginx en headers ni páginas de error.
    server_tokens off;

    # ─── Rate limiting ───────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Conexiones simultáneas por IP (hoy solo lo usa coffeekoff).
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name aypapol.com www.aypapol.com game.aypapol.com rolcito.aypapol.com desglosador3000.aypapol.com chat.aypapol.com livekit.aypapol.com rubas.aypapol.com
                    coffeekoff.com www.coffeekoff.com api.coffeekoff.com admin.coffeekoff.com;
        return 301 https://$host$request_uri;
    }

    # ─── aypapol.com → Sitio estático ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name aypapol.com www.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/aypapol;
        index index.html;

        # Block hidden files (.env, .git, etc.)
        location ~ /\. { deny all; return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ─── game.aypapol.com → Game Panel ───────────────────────────────────────
    server {
        listen 443 ssl;
        server_name game.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # OAuth well-known metadata (must come before dot-file deny)
        location ^~ /.well-known/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth authorization & token endpoints
        location ^~ /oauth/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block hidden files (.env, .git, etc.)
        location ~ /\. { deny all; return 404; }

        # MCP endpoint — no rate limit, streaming support
        location /api/mcp {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # File uploads — higher body size limit
        location ~ ^/api/servers/.+/files/upload$ {
            client_max_body_size 1000m;

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads grandes: stream directo al backend (sin buffer a disco) y
            # timeouts largos para no cortar la conexión (502) en archivos de cientos de MB.
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_body_timeout 3600s;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (live logs)
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─── rolcito.aypapol.com → Foundry VTT ────────────────────────────────────
    server {
        listen 443 ssl;
        server_name rolcito.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/rolcito.aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rolcito.aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Foundry sube mapas/assets grandes
        client_max_body_size 300m;

        location / {
            proxy_pass http://127.0.0.1:30000;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts largos para sesiones de juego
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ─── desglosador3000.aypapol.com → Desglosador 3000 ──────────────────────
    # Web app (web + api + collab) en una imagen única; nginx interno escucha en
    # :8080 con host networking, así que aquí proxyamos a 127.0.0.1:8080.
    # Igual que rolcito: solo responde cuando este es el game-container activo.
    server {
        listen 443 ssl;
        server_name desglosador3000.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/desglosador3000.aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/desglosador3000.aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Subidas de guiones / export de PDF.
        client_max_body_size 50m;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;

            # WebSocket upgrade — por aquí pasa también /collab (Hocuspocus).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket de larga duración.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ─── chat.aypapol.com → ChatPapol (backend Bun) ──────────────────────────
    # Servicio compose `chatpapol` en la red `panel`, publica 127.0.0.1:3210.
    # HTTP + WebSocket (chat en tiempo real). Repo: github.com/servo98/chatAyPapol
    server {
        listen 443 ssl;
        server_name chat.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/chat.aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Uploads: imágenes, stickers, sonidos, binarios de auto-update.
        client_max_body_size 100m;

        # ── Landing pública SOLO en la raíz exacta ──────────────────────────
        # Los browsers que entran a chat.aypapol.com ven una landing estática.
        # Los CLIENTES (app de escritorio, webhooks, updater) NO usan "/": llaman
        # a /api/*, /gateway y /files/*, que caen en "location /" y siguen igual.
        location = / {
            root /var/www/chat-landing;
            try_files /index.html =404;
        }

        # Health-check del backend (antes vivía en "/"; lo movemos aquí).
        location = /healthz {
            proxy_pass http://127.0.0.1:3210/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3210;
            proxy_http_version 1.1;

            # WebSocket upgrade (chat en tiempo real).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Conexiones WS de larga duración.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ─── livekit.aypapol.com → LiveKit SFU (señalización wss) ─────────────────
    # Servicio compose `livekit` en red host (127.0.0.1:7880). nginx termina TLS
    # y proxya la señalización WebSocket; el MEDIA va directo por UDP 50000-50100
    # (no pasa por nginx) → ese rango debe estar abierto en ufw.
    server {
        listen 443 ssl;
        server_name livekit.aypapol.com;

        # Cert SAN único que cubre chat + livekit (emitido con -d chat -d livekit;
        # certbot lo guarda bajo el primer dominio, chat.aypapol.com).
        ssl_certificate     /etc/letsencrypt/live/chat.aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:7880;
            proxy_http_version 1.1;

            # WebSocket upgrade (señalización DDP/SFU).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Señalización de larga duración.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ─── rubas.aypapol.com → Hosting estático de Rubas ────────────────────────
    # Sitios HTML/CSS/JS que Rubas sube arrastrando carpetas. Dos piezas:
    #   • Filebrowser (servicio compose `filebrowser`, 127.0.0.1:3290) en /admin/
    #     = panel privado con login para SUBIR carpetas (drag-and-drop).
    #   • nginx sirve cada carpeta como web real:
    #       /var/www/rubas/publico/<proyecto>/ → listado en la home y en /<proyecto>/
    #       /var/www/rubas/oculto/<proyecto>/  → servido pero NO listado (por ahora,
    #         "oculto" = no anunciado; los enlaces que caducan se añaden después).
    # El dir /srv/rubas/sites del host se monta :ro aquí y :rw en Filebrowser.
    # Las rutas RELATIVAS de los sitios funcionan: /<proyecto>/style.css mapea a
    # publico|oculto/<proyecto>/style.css. (Rutas absolutas /css/x.css NO — ver
    # DEPLOY-RUBAS.md > <base href>.) "admin" es una ruta RESERVADA, no un proyecto.
    server {
        listen 443 ssl;
        server_name rubas.aypapol.com;

        ssl_certificate     /etc/letsencrypt/live/rubas.aypapol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rubas.aypapol.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        index index.html;

        # Bloquear ficheros ocultos (.git, .env, etc.) de los proyectos servidos.
        location ~ /\. { deny all; return 404; }

        # ── Panel de subida (Filebrowser) ───────────────────────────────────
        # baseURL=/admin/ en el config → proxy_pass SIN URI (no reescribir el
        # path): el app ya sirve bajo /admin/. Subidas grandes de carpetas.
        location = /admin { return 301 /admin/; }
        location /admin/ {
            client_max_body_size 1000m;
            proxy_pass http://127.0.0.1:3290;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Filebrowser usa WebSocket (realtime/uploads).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── Home: índice auto-generado que lista los proyectos de publico/ ───
        location = / {
            root /var/www/rubas;
            try_files /index.html =404;
        }

        # ── Proyectos: publico/ primero, si no existe cae a oculto/ ──────────
        location / {
            root /var/www/rubas/publico;
            try_files $uri $uri/ @oculto;
        }
        location @oculto {
            root /var/www/rubas/oculto;
            try_files $uri $uri/ =404;
        }
    }

    # ─── coffeekoff.com (+ www, api, admin) → KOFF ────────────────────────────
    # Servicio compose `koff` (127.0.0.1:3300). Un solo contenedor atiende los 4
    # hosts y decide por el Host: landing y tarjeta, API pública, admin de tickets.
    # www → coffeekoff.com lo redirige la propia app. Cert SAN único emitido con
    # -d coffeekoff.com -d www -d api -d admin (certbot lo guarda bajo coffeekoff.com).
    # Los headers de seguridad (CSP, HSTS, X-Frame-Options) los pone la app.
    server {
        listen 443 ssl;
        server_name coffeekoff.com www.coffeekoff.com api.coffeekoff.com admin.coffeekoff.com;

        ssl_certificate     /etc/letsencrypt/live/coffeekoff.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coffeekoff.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 1m;

        # Contra conexiones lentas que acaparan workers (slowloris) y ráfagas de una sola IP.
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 30s;
        limit_conn perip 30;
        limit_req_status 429;
        limit_conn_status 429;

        # Páginas de KOFF en vez de las de nginx: mientras el contenedor se reinicia (un
        # despliegue, unos segundos) o si se cae, una que se recarga sola y ofrece pedir por
        # WhatsApp o DiDi; y si alguien recarga de más (429 del tope de arriba), una que pide
        # esperar. Van aquí mismo para no tocar docker-compose (que redesplegaría todo).
        error_page 502 503 504 = @koff_mantenimiento;
        error_page 429 = @koff_espera;
        location @koff_mantenimiento {
            default_type "text/html; charset=utf-8";
            add_header Cache-Control "no-store" always;
            add_header Retry-After "10" always;
            return 503 '<!doctype html><html lang="es"><head><title>Volvemos en un momento · KOFF</title><meta http-equiv="refresh" content="10"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#F7F3E9"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Work+Sans:wght@400;600&display=swap"><style>body{margin:0;background:#F7F3E9;color:#3D2618;font-family:"Work Sans","Helvetica Neue",Arial,sans-serif}main{max-width:560px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:20px}.marca{font-family:Poppins,sans-serif;font-weight:900;font-size:26px;letter-spacing:-.02em;color:#2A190F}h1{font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(34px,7vw,48px);line-height:1;letter-spacing:-.02em;margin:24px 0 0;color:#2A190F}p{margin:0;font-size:17px;line-height:1.6;color:#7B5B49}.acc{display:flex;flex-wrap:wrap;gap:12px}a.b{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid #3D2618;color:#3D2618}a.b1{background:#3D2618;color:#FDFCF8}.chico{font-size:14px}</style></head><body><main><span class="marca">KOFF</span><h1>Volvemos en un momento.</h1><p>Estamos actualizando la página. Se recarga sola en unos segundos; si tienes prisa, pide por WhatsApp o en DiDi.</p><div class="acc"><a class="b b1" href="https://wa.me/525518839669?text=Hola%20KOFF%2C%20quiero%20hacer%20un%20pedido">Pedir por WhatsApp</a><a class="b" href="https://order.top/store/koff/uW8GcB">Pedir en DiDi</a></div><p class="chico">Esta página se vuelve a intentar sola.</p></main></body></html>';
        }
        location @koff_espera {
            default_type "text/html; charset=utf-8";
            add_header Cache-Control "no-store" always;
            add_header Retry-After "15" always;
            return 429 '<!doctype html><html lang="es"><head><title>Un momento · KOFF</title><meta http-equiv="refresh" content="15"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#F7F3E9"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Work+Sans:wght@400;600&display=swap"><style>body{margin:0;background:#F7F3E9;color:#3D2618;font-family:"Work Sans","Helvetica Neue",Arial,sans-serif}main{max-width:560px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:20px}.marca{font-family:Poppins,sans-serif;font-weight:900;font-size:26px;letter-spacing:-.02em;color:#2A190F}h1{font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(34px,7vw,48px);line-height:1;letter-spacing:-.02em;margin:24px 0 0;color:#2A190F}p{margin:0;font-size:17px;line-height:1.6;color:#7B5B49}.acc{display:flex;flex-wrap:wrap;gap:12px}a.b{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid #3D2618;color:#3D2618}a.b1{background:#3D2618;color:#FDFCF8}.chico{font-size:14px}</style></head><body><main><span class="marca">KOFF</span><h1>Vas muy rápido.</h1><p>Recibimos muchas visitas tuyas seguidas. Espera unos segundos: la página se recarga sola.</p><div class="acc"><a class="b b1" href="https://wa.me/525518839669?text=Hola%20KOFF%2C%20quiero%20hacer%20un%20pedido">Pedir por WhatsApp</a><a class="b" href="https://order.top/store/koff/uW8GcB">Pedir en DiDi</a></div></main></body></html>';
        }

        location / {
            limit_req zone=api burst=80 nodelay;  # la landing pide ~35 archivos de golpe

            proxy_pass http://127.0.0.1:3300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
